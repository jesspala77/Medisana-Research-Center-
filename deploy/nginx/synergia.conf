# Production-ready Laravel site config
# Replace EXAMPLE_DOMAIN with your live host name before deploying.
server {
    listen 80;
    listen [::]:80;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    root /var/www/synergia/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/EXAMPLE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/EXAMPLE_DOMAIN/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 25M;

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|webp|ico|ttf|woff|woff2)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
